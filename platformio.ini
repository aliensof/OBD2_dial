[env:m5dial]
platform = espressif32@^6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
; StampS3 sets ARDUINO_USB_MODE=1 but not CDC_ON_BOOT, so Serial would go to
; UART0 (GPIO43/44) instead of the USB-C port. Without this, no serial log.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Dial@^1.0.3
    h2zero/NimBLE-Arduino@^1.4.3
